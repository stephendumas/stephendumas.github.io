title: Stephen Michael Dumas
description: >-
  Electrical engineering, research, and a personal archive of history,
  genealogy, music, and game design by Stephen Michael Dumas.
author:
  name: Stephen Michael Dumas
lang: en-US
timezone: America/Denver

# Review deployment only. Change url after the custom-domain migration is ready.
url: "https://stephendumas.github.io"
baseurl: ""
repository: stephendumas/stephendumas.github.io
review_mode: true

encoding: UTF-8
markdown: kramdown
highlighter: rouge
permalink: pretty
strict_front_matter: true

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - MIGRATION.md
  - scripts
  - vendor
  - .bundle
  - .jekyll-cache
  - .jekyll-metadata
  - dist

defaults:
  - scope:
      path: ""
    values:
      layout: page

kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false

sass:
  style: compressed
